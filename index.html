<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Mythic Dungeons v0.7</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080605;color:#f5e8c3;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button,input{font:inherit}.app{width:min(100vw,430px);margin:auto;background:#0d0907;min-height:100svh}.hidden{display:none!important}
.createPage{min-height:100svh;display:flex;align-items:flex-start;justify-content:center;padding-top:max(env(safe-area-inset-top),4px);overflow-x:hidden}.canvas{width:100%;aspect-ratio:9/16;position:relative;overflow:hidden;background:linear-gradient(#1c222a 0 46%,#17110d 46% 100%);border-inline:1px solid #44301a;box-shadow:0 0 28px #000}
.canvas:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,transparent 0 24%,#0006 48%,#000b 100%),repeating-linear-gradient(90deg,#fff0 0 11.6%,#d3a65a12 11.6% 12%);pointer-events:none}
.headerLogo{position:absolute;left:22%;right:22%;top:1%;z-index:10;text-align:center;font:900 clamp(19px,7vw,34px)/.82 Georgia,serif;color:#f0c25a;text-shadow:0 2px 0 #5c3210,0 5px 9px #000}.headerLogo small{display:block;margin-top:4px;padding:3px 5px;border-radius:0 0 40% 40%;background:#c98b43;color:#2b180c;font:900 clamp(8px,2.8vw,14px)/1 Georgia,serif;text-shadow:none;border:2px solid #70471f}
.iconBtn{position:absolute;top:1.3%;z-index:12;height:4.8%;min-height:30px;border:2px solid #8b642f;border-radius:5px;background:linear-gradient(#34404b,#151c22);color:#fff4d0;font-weight:900;box-shadow:0 3px 6px #000a}.back{left:1.5%;width:15%}.gear{right:1.5%;width:9%;font-size:1.2em}.banner{position:absolute;top:6.8%;width:16%;height:12.5%;background:linear-gradient(#c5a36d,#9c7749);color:#2b1a10;border:2px solid #5d351d;clip-path:polygon(0 0,100% 0,100% 86%,78% 100%,57% 90%,39% 100%,19% 90%,0 100%);padding:8px 5px;text-align:center;font:900 clamp(6px,2.1vw,10px)/1.15 Arial}.banner.left{left:2%}.banner.right{right:2%}
.stage{position:absolute;left:0;right:0;top:0;height:49.8%;overflow:hidden;background:linear-gradient(#172634 0 35%,#31231a 70%,#1b120d)}.stage:before{content:"";position:absolute;left:14%;right:14%;top:10%;height:66%;border:8px solid #4b4439;border-bottom:0;border-radius:50% 50% 0 0;box-shadow:inset 0 0 22px #0008}.torch{position:absolute;top:18%;width:3%;height:18%;background:linear-gradient(#ffe788,#ff6a00 30%,transparent 31%);filter:blur(.2px);box-shadow:0 0 16px #ff7a00}.t1{left:6%}.t2{right:6%}.hero{position:absolute;left:50%;bottom:-1%;height:83%;max-width:70%;transform:translateX(-50%);object-fit:contain;filter:drop-shadow(0 7px 5px #000d);transition:.16s}.hero.pulse{transform:translateX(-50%) scale(1.025)}.sideSign{position:absolute;top:22%;width:18%;padding:5px;background:#c6a26f;color:#28180f;border:2px solid #61391f;font:900 clamp(6px,1.9vw,9px)/1.15 Arial;text-align:center}.sideSign.l{left:1.2%;transform:rotate(-2deg)}.sideSign.r{right:1.2%;transform:rotate(2deg)}
.classRow{position:absolute;left:.6%;right:.6%;top:49.2%;height:16.6%;display:grid;grid-template-columns:repeat(6,1fr);gap:.6%;z-index:8}.classCard{position:relative;overflow:hidden;border:2px solid #6e502a;border-radius:4px;background:#15100c;color:#fff;padding:0;box-shadow:inset 0 0 0 1px #000}.classCard.active{border-color:#43d7ff;box-shadow:0 0 8px #16cfff}.classCard img{position:absolute;left:0;right:0;top:0;width:100%;height:72%;object-fit:contain}.classCard:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#090706ee 45%)}.classCard b{position:absolute;z-index:2;left:1px;right:1px;bottom:15%;font-size:clamp(5px,1.8vw,9px);line-height:1;text-align:center}.classCard small{position:absolute;z-index:2;left:2px;right:2px;bottom:2%;font-size:clamp(3px,1vw,5px);line-height:1.05;text-align:center;color:#e5d4b6}
.customGrid{position:absolute;left:.7%;right:.7%;top:66.3%;height:17.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:.8%;z-index:9}.panel{border:2px solid #76552f;border-radius:4px;background:linear-gradient(#27231f,#16120f);padding:3px 4px;overflow:hidden}.panelTitle{color:#e7c573;font:900 clamp(6px,2vw,10px)/1 Georgia,serif;margin-bottom:3px}.opts{height:70%;display:flex;gap:3px;align-items:stretch}.opt{flex:1;border:1px solid #60452a;border-radius:4px;background:#33271f;color:#f5e4c4;padding:0;font-size:clamp(5px,1.6vw,8px);min-width:0}.opt.active{border:2px solid #3bd5ff;box-shadow:0 0 6px #16cfff;color:#fff}.swatch{border-radius:4px;border:2px solid #5b4027;min-width:18px}.gender .opt{font-size:clamp(14px,5vw,22px)}
.nameRow{position:absolute;left:.7%;right:.7%;top:84.5%;height:7%;display:grid;grid-template-columns:14% 1fr 9% 23%;gap:.7%;align-items:center;z-index:10}.nameLabel{font:900 clamp(8px,2.4vw,12px)/1 Georgia,serif;color:#e6c16e;text-align:center}.nameInput{width:100%;height:78%;background:#17171a;border:2px solid #665037;color:#fff;padding:0 8px;border-radius:4px;font-size:clamp(8px,2.4vw,12px)}.dice,.legend{height:78%;border:2px solid #76552f;border-radius:4px;background:#24201b;color:#fff;font-weight:900}.legend{background:#c8a46d;color:#321d10;font-size:clamp(5px,1.7vw,8px);line-height:1.1}
.startBtn{position:absolute;left:20%;right:20%;bottom:1.3%;height:7.5%;z-index:12;border:3px solid #e0ad44;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);background:linear-gradient(#df342d,#9e1715);color:#fff4d2;font:900 clamp(13px,4.5vw,22px)/1 Georgia,serif;text-shadow:0 2px #58100e;box-shadow:0 4px 10px #000}
.game{min-height:100svh;padding:10px 10px 74px;background:linear-gradient(#18334b,#6f4926 55%,#17100b);position:relative}.topbar{display:flex;gap:6px;align-items:center;background:#1b1510e8;border:2px solid #815c2e;border-radius:8px;padding:6px}.topbar img{width:42px;height:42px;object-fit:contain}.pill{margin-left:auto;background:#16100d;border:1px solid #72512b;border-radius:7px;padding:6px}.townHero{display:block;margin:40px auto 0;height:410px;max-width:90%;object-fit:contain;filter:drop-shadow(0 10px 7px #000)}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.menu button{min-height:65px;background:#17110de8;border:2px solid #80592c;color:#ffe5aa;border-radius:7px;font-weight:900}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;background:#0f0a07;border-top:2px solid #64431f}.bottom button{min-height:52px;background:#1d140e;border:1px solid #604526;color:#e5cf9e;border-radius:6px}
</style></head><body><main class="app">
<section id="create" class="createPage"><div class="canvas">
<div class="stage"><div class="torch t1"></div><div class="torch t2"></div><div class="headerLogo">MYTHIC<br>DUNGEONS<small>Kahramanını Oluştur</small></div><button class="iconBtn back">← GERİ</button><button class="iconBtn gear">⚙</button><div class="banner left">KAHRAMANLAR EFSANELER YARATMAZ… ONLAR DİVANALIKTIR!</div><div class="banner right">AYNI ZİNDAN FARKLI AHMAKLAR! İŞTE OLAY BU!</div><div class="sideSign l">İYİ İNSANLAR BURADA DA İÇER!</div><div class="sideSign r">YAĞMALA<br>• GELİŞ<br>• KEPEZ OL<br>• TEKRAR DENE</div><img id="heroArt" class="hero" src="assets/heroes/warrior.svg"></div>
<div id="classRow" class="classRow"></div>
<div class="customGrid">
<div class="panel"><div class="panelTitle">✦ CİNSİYET</div><div class="opts gender" data-k="gender"><button class="opt active" data-v="Erkek">♂<br><small>Erkek</small></button><button class="opt" data-v="Kadın">♀<br><small>Kadın</small></button></div></div>
<div class="panel"><div class="panelTitle">✦ CÜSSE</div><div class="opts" data-k="body"><button class="opt" data-v="Zayıf">Zayıf</button><button class="opt active" data-v="Normal">Normal</button><button class="opt" data-v="Kaslı">Kaslı</button><button class="opt" data-v="Hantal">Hantal</button></div></div>
<div class="panel"><div class="panelTitle">✦ SAÇ</div><div class="opts" data-k="hair"><button class="opt active" data-v="1">🧑🏻</button><button class="opt" data-v="2">🧑🏼</button><button class="opt" data-v="3">🧑🏽</button><button class="opt" data-v="4">🧑🏻‍🦳</button><button class="opt" data-v="5">👨🏻‍🦲</button></div></div>
<div class="panel"><div class="panelTitle">✦ SAKAL</div><div class="opts" data-k="beard"><button class="opt active" data-v="Yok">⊘</button><button class="opt" data-v="1">🧔🏻</button><button class="opt" data-v="2">🧔🏽</button><button class="opt" data-v="3">🧔🏿</button></div></div>
<div class="panel"><div class="panelTitle">✦ GÖZ RENGİ</div><div class="opts" data-k="eyes"><button class="opt swatch active" data-v="Kahve" style="background:#6f3719"></button><button class="opt swatch" data-v="Mavi" style="background:#20aeea"></button><button class="opt swatch" data-v="Yeşil" style="background:#2fa748"></button><button class="opt swatch" data-v="Altın" style="background:#f1a317"></button><button class="opt swatch" data-v="Mor" style="background:#9144c5"></button></div></div>
<div class="panel"><div class="panelTitle">✦ TEN RENGİ</div><div class="opts" data-k="skin"><button class="opt swatch active" data-v="1" style="background:#f0bda0"></button><button class="opt swatch" data-v="2" style="background:#d58b5e"></button><button class="opt swatch" data-v="3" style="background:#a25f42"></button><button class="opt swatch" data-v="4" style="background:#714535"></button><button class="opt swatch" data-v="5" style="background:#4b2d28"></button></div></div>
</div>
<div class="nameRow"><div class="nameLabel">İSİM</div><input id="heroName" class="nameInput" placeholder="Kahramanının adını gir..." maxlength="16"><button id="dice" class="dice">🎲</button><button class="legend">EFSANE SENİNLE BAŞLAR!</button></div>
<button id="startBtn" class="startBtn">⚔ MACERAYA BAŞLA</button>
</div></section>
<section id="game" class="game hidden"><div class="topbar"><img id="avatar"><div><b id="nameOut">Kahraman</b><div id="classOut" style="font-size:11px;color:#d6bb8a"></div></div><div class="pill">🪙 250</div></div><img id="townHero" class="townHero"><div class="menu"><button>📜<br>GÖREVLER</button><button>💀<br>ZİNDAN</button><button>🛡️<br>KAHRAMAN</button><button>🎒<br>ÇANTA</button><button>🔨<br>DEMİRCİ</button><button>🍺<br>TAVERNA</button></div><div class="bottom"><button>🏰<br>ŞEHİR</button><button>🛡️<br>KAHRAMAN</button><button>🎒<br>ÇANTA</button><button>⚔️<br>SAVAŞ</button></div></section>
</main><script>
const HEROES=[
{name:'SAVAŞÇI',asset:'assets/heroes/warrior.svg',tag:'ÖNCE VUR. SONRA SOR.'},
{name:'OKÇU',asset:'assets/heroes/ranger.svg',tag:'UZAKTAN ÇÖZ, YAKINDAN KAÇ.'},
{name:'BÜYÜCÜ',asset:'assets/heroes/mage.svg',tag:'SORULAR SOR. GERÇEĞİ UMURSAMA.'},
{name:'SUİKASTÇI',asset:'assets/heroes/assassin.svg',tag:'ŞİMDİ SAPLA. SONRA AÇIKLA.'},
{name:'PALADİN',asset:'assets/heroes/paladin.svg',tag:'İYİLİK YAP. HARİKA GÖRÜN.'},
{name:'NEKROMANSER',asset:'assets/heroes/necromancer.svg',tag:'ARKADAŞLAR ASLA ÖLMEZ.'}
];
const S={hero:0,gender:'Erkek',body:'Normal',hair:'1',beard:'Yok',eyes:'Kahve',skin:'1',name:''};
const $=id=>document.getElementById(id);
function buildClasses(){const row=$('classRow');row.innerHTML='';HEROES.forEach((h,i)=>{const b=document.createElement('button');b.className='classCard'+(i===S.hero?' active':'');b.innerHTML='<img src="'+h.asset+'"><b>'+h.name+'</b><small>'+h.tag+'</small>';b.addEventListener('click',()=>{S.hero=i;$('heroArt').src=h.asset;$('heroArt').classList.add('pulse');setTimeout(()=>$('heroArt').classList.remove('pulse'),160);buildClasses()});row.appendChild(b)})}
function bindOptions(){document.querySelectorAll('.opts').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{g.querySelectorAll('.opt').forEach(x=>x.classList.remove('active'));b.classList.add('active');S[g.dataset.k]=b.dataset.v})))}
$('dice').addEventListener('click',()=>{const n=['Rauf','Aydin','Boran','Tavukhan','Gribnik','Eldor','Kezbanor'];$('heroName').value=n[Math.floor(Math.random()*n.length)]});
$('startBtn').addEventListener('click',()=>{S.name=$('heroName').value.trim()||'Adsız Kahraman';$('create').classList.add('hidden');$('game').classList.remove('hidden');$('avatar').src=HEROES[S.hero].asset;$('townHero').src=HEROES[S.hero].asset;$('nameOut').textContent=S.name;$('classOut').textContent=HEROES[S.hero].name});
buildClasses();bindOptions();
</script></body></html>
